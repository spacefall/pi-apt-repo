name: Build custom Pi 5 kernel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kernel.yml'

env:
  RPI_LINUX_BRANCH: rpi-6.18.y
  KERNEL_LOCALVERSION: -sata

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make build-essential debhelper-compat libdw-dev libelf-dev llvm lld clang
      
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ env.RPI_LINUX_BRANCH }}

      - name: Clone raspberrypi/linux
        run: |
          git clone --depth=1 --branch "${RPI_LINUX_BRANCH}" https://github.com/raspberrypi/linux.git

      - name: Configure kernel
        working-directory: linux
        run: |
          git apply ../kernel-builddeb.patch
          make LLVM=1 bcm2712_defconfig
          ./scripts/config --enable CONFIG_ATA
          ./scripts/config --enable CONFIG_SATA_AHCI
          ./scripts/config --set-str CONFIG_LOCALVERSION ${KERNEL_LOCALVERSION}
          make LLVM=1 olddefconfig

      - name: Build kernel
        working-directory: linux
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          PATH="/usr/lib/ccache:${PATH}" make LLVM=1 -j"$(nproc)" Image modules dtbs
      
      - name: Package
        working-directory: linux
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          PATH="/usr/lib/ccache:${PATH}" make LLVM=1 -j"$(nproc)" bindeb-pkg LOCALVERSION="-rpi-2712"

      - name: Prep apt repo
        run: |
          mkdir -p repo/pool
          mv linux-*.deb repo/pool/
          cd repo
          dpkg-scanpackages pool /dev/null > Packages
          gzip -9c Packages > Packages.gz

      - name: Publish repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: apt-repo
          force_orphan: true
